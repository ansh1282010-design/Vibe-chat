<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibe-chat - Ultimate Social App</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #fff; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .card { background: #1e293b; padding: 25px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.3); width: 350px; text-align: center; }
        input, select { width: 100%; padding: 12px; margin: 10px 0; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #fff; font-size: 15px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.3s; margin-top: 5px; }
        button:hover { background: #1d4ed8; }
        .hidden { display: none; }
        
        #app-container { display: none; width: 100vw; height: 100vh; background: #0f172a; flex-direction: column; }
        .header { background: #1e293b; padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
        .main-content { display: flex; flex: 1; overflow: hidden; }
        .sidebar { width: 300px; background: #1e293b; border-right: 1px solid #334155; display: flex; flex-direction: column; padding: 10px; }
        .chat-area { flex: 1; display: flex; flex-direction: column; padding: 20px; justify-content: space-between; }
        .user-list { flex: 1; overflow-y: auto; margin-top: 10px; }
        .user-item { padding: 10px; margin: 5px 0; background: #334155; border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .user-item:hover { background: #475569; }
        .chat-box { flex: 1; background: #1e293b; border-radius: 8px; padding: 15px; overflow-y: auto; margin-bottom: 15px; }
        .input-group { display: flex; gap: 10px; }
    </style>
</head>
<body>

    <div style="position: absolute; top: 15px; right: 15px; z-index: 100;">
        <select id="lang-select" style="width: 130px; padding: 8px; background: #1e293b; color: #fff; border-radius: 6px;" onchange="changeLanguage()">
            <option value="hi">हिंदी (Hindi)</option>
            <option value="en">English</option>
        </select>
    </div>

    <div class="card" id="login-card">
        <h2 id="t-login-title">Vibe-chat लॉगिन</h2>
        
        <div id="phone-box">
            <p id="t-phone-desc" style="color: #94a3b8; font-size: 13px;">फायरबेस असली OTP के लिए नंबर (+91) डालें</p>
            <input type="tel" id="phone" value="+91">
            <button id="t-otp-btn" onclick="sendOTP()">असली OTP भेजें</button>
        </div>

        <div id="otp-box" class="hidden">
            <p id="t-otp-desc" style="color: #94a3b8; font-size: 13px;">6-अंकों का OTP दर्ज करें</p>
            <input type="text" id="otp" placeholder="OTP कोड">
            <button id="t-verify-btn" onclick="verifyOTP()">लॉगिन वेरिफ़ाई करें</button>
        </div>
        <div id="recaptcha-container"></div>
    </div>

    <div id="app-container">
        <div class="header">
            <h3 id="t-dash-title">✨ Vibe-chat डैशबोर्ड</h3>
            <span id="current-user-phone" style="color: #38bdf8;"></span>
        </div>
        <div class="main-content">
            <div class="sidebar">
                <input type="text" id="search-user" placeholder="🔍 यूजर खोजें..." onkeyup="searchUsers()">
                <h4 id="t-profiles-title">उपलब्ध प्रोफाइल्स और फ्रेंड्स</h4>
                <div class="user-list" id="user-list-container"></div>
                <button id="t-group-btn" style="background: #7c3aed;" onclick="createGroup()">+ नया ग्रुप बनाएं</button>
            </div>

            <div class="chat-area">
                <div style="display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 10px; border-radius: 8px;">
                    <h4 id="active-chat-title">बातचीत करने के लिए किसी फ्रेंड को चुनें</h4>
                    <div>
                        <button id="t-vcall-btn" style="width: auto; padding: 6px 12px; background: #059669;" onclick="startVideoCall()">📹 वीडियो कॉल</button>
                        <button id="t-games-btn" style="width: auto; padding: 6px 12px; background: #d97706;" onclick="openGames()">🎮 गेम्स</button>
                    </div>
                </div>

                <div class="chat-box" id="chat-messages">
                    <p id="t-chat-rule" style="color: #64748b; text-align: center; margin-top: 50px;">🔒 नियम: जब तक आप किसी को फ्रेंड के रूप में 'Add' नहीं करते, तब तक आप चैट नहीं कर सकते।</p>
                </div>

                <div class="input-group">
                    <input type="text" id="message-input" placeholder="संदेश टाइप करें..." disabled>
                    <button style="width: 100px;" id="send-btn" onclick="sendMessage()" disabled>भेजें</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
        import { getAuth, RecaptchaVerifier, signInWithPhoneNumber } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDbpmpBIy11gFGDxLUozh1SJU3uBT42mkg",
            authDomain: "vibe-chat-18d70.firebaseapp.com",
            projectId: "vibe-chat-18d70",
            storageBucket: "vibe-chat-18d70.firebasestorage.app",
            messagingSenderId: "395626347700",
            appId: "1:395626347700:web:f085ad8647184f6db56be1",
            measurementId: "G-JT8R3DPW60"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        window.onload = function() {
            window.recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', {
                'size': 'invisible'
            });
            changeLanguage();
        };

        window.sendOTP = function() {
            const phoneNumber = document.getElementById('phone').value;
            signInWithPhoneNumber(auth, phoneNumber, window.recaptchaVerifier)
                .then((confirmationResult) => {
                    window.confirmationResult = confirmationResult;
                    const lang = document.getElementById('lang-select').value;
                    alert(lang === 'hi' ? "असली OTP भेज दिया गया है!" : "Real OTP sent successfully!");
                    document.getElementById('phone-box').classList.add('hidden');
                    document.getElementById('otp-box').classList.remove('hidden');
                }).catch((error) => {
                    alert("Error: " + error.message);
                });
        }

        window.verifyOTP = function() {
            const code = document.getElementById('otp').value;
            window.confirmationResult.confirm(code).then((result) => {
                const user = result.user;
                document.getElementById('login-card').style.display = 'none';
                document.getElementById('app-container').style.display = 'flex';
                document.getElementById('current-user-phone').innerText = (document.getElementById('lang-select').value === 'hi' ? "यूजर: " : "User: ") + user.phoneNumber;
                loadSampleUsers();
            }).catch((error) => {
                const lang = document.getElementById('lang-select').value;
                alert(lang === 'hi' ? "गलत OTP दर्ज किया गया है!" : "Invalid OTP entered!");
            });
        }
    </script>

    <script>
        const translations = {
            hi: {
                loginTitle: "Vibe-chat लॉगिन",
                phoneDesc: "फायरबेस असली OTP के लिए नंबर (+91) डालें",
                otpBtn: "असली OTP भेजें",
                otpDesc: "6-अंकों का OTP दर्ज करें",
                verifyBtn: "लॉगिन वेरिफ़ाई करें",
                dashTitle: "✨ Vibe-chat डैशबोर्ड",
                searchPlaceholder: "🔍 यूजर खोजें...",
                profilesTitle: "उपलब्ध प्रोफाइल्स और फ्रेंड्स",
                groupBtn: "+ नया ग्रुप बनाएं",
                activeTitle: "बातचीत करने के लिए किसी फ्रेंड को चुनें",
                vcallBtn: "📹 वीडियो कॉल",
                gamesBtn: "🎮 गेम्स",
                chatRule: "🔒 नियम: जब तक आप किसी को फ्रेंड के रूप में 'Add' नहीं करते, तब तक आप चैट नहीं कर सकते।",
                msgPlaceholder: "संदेश टाइप करें...",
                sendBtn: "भेजें",
                chatBtnText: "चैट करें",
                addBtnText: "ऐड करें"
            },
            en: {
                loginTitle: "Vibe-chat Login",
                phoneDesc: "Enter phone number (+91) for Firebase Real OTP",
                otpBtn: "Send Real OTP",
                otpDesc: "Enter 6-digit OTP code",
                verifyBtn: "Verify Login",
                dashTitle: "✨ Vibe-chat Dashboard",
                searchPlaceholder: "🔍 Search users...",
                profilesTitle: "Available Profiles & Friends",
                groupBtn: "+ Create New Group",
                activeTitle: "Select a friend to start chatting",
                vcallBtn: "📹 Video Call",
                gamesBtn: "🎮 Games",
                chatRule: "🔒 Rule: You cannot chat until you add the person as a friend.",
                msgPlaceholder: "Type a message...",
                sendBtn: "Send",
                chatBtnText: "Chat",
                addBtnText: "Add"
            }
        };

        function changeLanguage() {
            const lang = document.getElementById('lang-select').value;
            const t = translations[lang];

            document.getElementById('t-login-title').innerText = t.loginTitle;
            document.getElementById('t-phone-desc').innerText = t.phoneDesc;
            document.getElementById('t-otp-btn').innerText = t.otpBtn;
            document.getElementById('t-otp-desc').innerText = t.otpDesc;
            document.getElementById('t-verify-btn').innerText = t.verifyBtn;
            document.getElementById('t-dash-title').innerText = t.dashTitle;
            document.getElementById('search-user').placeholder = t.searchPlaceholder;
            document.getElementById('t-profiles-title').innerText = t.profilesTitle;
            document.getElementById('t-group-btn').innerText = t.groupBtn;
            document.getElementById('active-chat-title').innerText = t.activeTitle;
            document.getElementById('t-vcall-btn').innerText = t.vcallBtn;
            document.getElementById('t-games-btn').innerText = t.gamesBtn;
            document.getElementById('t-chat-rule').innerText = t.chatRule;
            document.getElementById('message-input').placeholder = t.msgPlaceholder;
            document.getElementById('send-btn').innerText = t.sendBtn;

            renderUsers(allUsers);
        }

        let allUsers = [
            { id: 1, name: "Rahul Kumar", phone: "+91 9876543210", isFriend: false },
            { id: 2, name: "Amit Verma", phone: "+91 9123456789", isFriend: true },
            { id: 3, name: "Priya Sharma", phone: "+91 9988776655", isFriend: false }
        ];
        
        let activeUser = null;

        function renderUsers(usersToDisplay) {
            const lang = document.getElementById('lang-select').value;
            const t = translations[lang];
            const container = document.getElementById('user-list-container');
            container.innerHTML = "";
            usersToDisplay.forEach(u => {
                container.innerHTML += `
                    <div class="user-item">
                        <div>
                            <strong>${u.name}</strong><br><small style="color:#94a3b8">${u.phone}</small>
                        </div>
                        <div>
                            ${u.isFriend ? 
                                `<button style="padding: 4px 8px; font-size:12px; background:#16a34a;" onclick="openChat('${u.name}')">${t.chatBtnText}</button>` : 
                                `<button style="padding: 4px 8px; font-size:12px; background:#2563eb;" onclick="addFriend(${u.id})">${t.addBtnText}</button>`
                            }
                        </div>
                    </div>
                `;
            });
        }

        function loadSampleUsers() {
            renderUsers(allUsers);
        }

        function searchUsers() {
            const query = document.getElementById('search-user').value.toLowerCase();
            const filtered = allUsers.filter(u => u.name.toLowerCase().includes(query) || u.phone.includes(query));
            renderUsers(filtered);
        }

        function addFriend(id) {
            const user = allUsers.find(u => u.id === id);
            const lang = document.getElementById('lang-select').value;
            if(user) {
                user.isFriend = true;
                alert(lang === 'hi' ? `${user.name} को फ्रेंड लिस्ट में जोड़ लिया गया है!` : `${user.name} added to friends list!`);
                renderUsers(allUsers);
            }
        }

        function openChat(name) {
            activeUser = name;
            const lang = document.getElementById('lang-select').value;
            document.getElementById('active-chat-title').innerText = (lang === 'hi' ? "चैट विथ: " : "Chat with: ") + name;
            document.getElementById('message-input').disabled = false;
            document.getElementById('send-btn').disabled = false;
            document.getElementById('chat-messages').innerHTML = `<p style="color: #38bdf8;">${name} ${lang === 'hi' ? 'के साथ चैट शुरू...' : 'chat started...'}</p>`;
        }

        function sendMessage() {
            const input = document.getElementById('message-input');
            const msg = input.value.trim();
            if(msg && activeUser) {
                const box = document.getElementById('chat-messages');
                box.innerHTML += `<div style="text-align: right; margin: 5px 0;"><span style="background: #2563eb; padding: 8px 12px; border-radius: 8px; display: inline-block;">${msg}</span></div>`;
                input.value = "";
                box.scrollTop = box.scrollHeight;
            }
        }

        function createGroup() {
            const lang = document.getElementById('lang-select').value;
            const groupName = prompt(lang === 'hi' ? "अपने नए ग्रुप का नाम दर्ज करें:" : "Enter new group name:");
            if(groupName) {
                alert(lang === 'hi' ? `ग्रुप "${groupName}" बन गया है!` : `Group "${groupName}" created!`);
            }
        }

        function startVideoCall() {
            const lang = document.getElementById('lang-select').value;
            alert(lang === 'hi' ? "वीडियो कॉल शुरू हो रही है..." : "Starting video call...");
        }

        function openGames() {
            const lang = document.getElementById('lang-select').value;
            alert(lang === 'hi' ? "गेमिंग ज़ोन खुल रहा है..." : "Opening gaming zone...");
        }
    </script>
</body>
</html>
